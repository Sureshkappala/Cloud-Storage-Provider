<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="404 Sector Not Found - Stackly cloud storage.">
  <title>Sector Not Found (404) | Stackly Cloud Storage</title>
  
  <!-- FontAwesome for Premium Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- CSS Link -->
  <link rel="stylesheet" href="styles.css">
  
  <!-- Google Fonts Preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    .error-body {
      background-color: var(--bg-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 2rem 1rem;
      overflow: hidden;
      text-align: center;
    }

    /* Ambient Background Glows */
    .ambient-blob {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      filter: blur(80px);
      opacity: 0.25;
    }
    
    .blob-cyan {
      width: 300px;
      height: 300px;
      background: var(--accent-cyan);
      top: -10%;
      left: -10%;
    }
    
    .blob-purple {
      width: 350px;
      height: 350px;
      background: var(--accent-purple);
      bottom: -10%;
      right: -10%;
    }

    .error-container {
      z-index: 1;
      max-width: 600px;
      padding: 3rem 2.25rem;
    }

    .error-code {
      font-size: 8rem;
      font-weight: 800;
      font-family: var(--font-title);
      line-height: 1;
      margin-bottom: 1.5rem;
      letter-spacing: -2px;
      background: linear-gradient(135deg, var(--accent-cyan) 0%, var(--accent-purple) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 30px rgba(0, 229, 255, 0.15));
    }
  </style>
</head>
<body class="error-body">

  <!-- Ambient Glow Blobs -->
  <div class="ambient-blob blob-cyan"></div>
  <div class="ambient-blob blob-purple"></div>

  <!-- ERROR CONTAINER -->
  <div class="error-container glass-card" style="border: 1px solid rgba(0, 229, 255, 0.12); box-shadow: 0 15px 35px rgba(0,0,0,0.4);">
    <div class="error-code">404</div>
    
    <h2 style="font-size: 2rem; margin-bottom: 1rem; color: #fff; font-weight: 700;">Storage Sector Not Found</h2>
    
    <p style="font-size: 1rem; color: var(--text-secondary); line-height: 1.6; margin-bottom: 2.5rem; max-width: 480px; margin-left: auto; margin-right: auto;">
      The vault partition or directory target you are trying to access does not exist or has been relocated to another regional node.
    </p>

    <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
      <a href="index.html" class="btn btn-primary">
        <i class="fa-solid fa-house"></i> Back to Home
      </a>
      <button onclick="window.history.back()" class="btn btn-secondary" style="display: inline-flex; align-items: center; gap: 0.5rem;">
        <i class="fa-solid fa-arrow-left"></i> Go Back
      </button>
    </div>
  </div>

</body>
</html>
